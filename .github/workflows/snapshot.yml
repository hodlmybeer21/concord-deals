# Weekly price history (data/history/YYYY-MM-DD.json). Runs after the Sunday and Wednesday flyer changes.
# Only flipp.com (Flipp's public flyer API) is fetched; no walmart.com / samsclub.com scraping.
name: snapshot
on:
  schedule: [{ cron: '30 12 * * 0,3' }] # 12:30 UTC = 8:30 AM EDT / 7:30 AM EST
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/snapshot.mjs --history-only
      - run: |
          git config user.name hodlmybeer21
          git config user.email 268759581+hodlmybeer21@users.noreply.github.com
          git add data/history
          git diff --cached --quiet || git commit -m "Price history $(date -u +%F)" && git push
